[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats2015-midterm"
version = "0.1.0"
description = "Windows notebook-first BraTS 2015 light segmentation benchmark"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]
